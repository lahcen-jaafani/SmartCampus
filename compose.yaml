services:
  api:
    build: .
    container_name: smartcampus-api
    ports:
      - "8088:8088"
    environment:
      SERVER_PORT: 8088
      SPRING_DATASOURCE_URL: jdbc:h2:mem:smartcampus
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    volumes:
      - appdata:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/actuator/health || wget -qO- http://localhost:8088/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  appdata:
