<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>SmartCampus — Inscription</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div class="card">
  <h1>SmartCampus</h1>
  <p class="sub">Créer un compte </p>
  <form id="regForm">
    <input type="email" id="email" placeholder="Email institutionnel" required>
    <input type="password" id="password" placeholder="Mot de passe" required>
    <input type="password" id="confirm" placeholder="Confirmer le mot de passe" required>
    <button type="submit">S'inscrire</button>
  </form>
  <p class="msg" id="msg"></p>
  <p class="link">Déjà un compte ? <a href="/login">Se connecter</a></p>
</div>
<script>
document.getElementById('regForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email=document.getElementById('email').value;
  const password=document.getElementById('password').value;
  const confirm=document.getElementById('confirm').value;
  const msg=document.getElementById('msg');
  if(password!==confirm){msg.textContent='Les mots de passe ne correspondent pas';return;}
  const r = await fetch('/api/auth/register', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email:email, password:password})});
  if (r.ok) { window.location='/login'; }
  else { const d = await r.json().catch(()=>({})); msg.textContent = d.message || 'Échec'; }
});
</script>
</body></html>
